name: Docker

# Builds and pushes the hostable service images (OMS + MCP) to GHCR.
# On version tags they are tagged with the release version and `latest`; on
# main pushes only with `main`. Ingestion is a library of injectable stubs with
# no standalone entrypoint, so no image is built for it.
on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: oms
            dockerfile: packages/ontology-oms/Dockerfile
          - service: mcp
            dockerfile: packages/mcp-server/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Matches the chart's `{{ image.registry }}/{{ image.repository }}-<svc>`.
          images: ghcr.io/${{ github.repository_owner }}/solana-ontology-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
