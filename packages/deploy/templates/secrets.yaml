# yaml-language-server: $schema=none
#
# This Secret is rendered from .Values.secrets, which default to empty. Do NOT
# commit real credentials into values files. For production, disable this
# template (leave the values empty) and manage the Secret out-of-band with an
# external secret manager (External Secrets Operator, sealed-secrets, or a cloud
# secret store) that creates a Secret named "<release>-secrets" with the same keys.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "solana-ontology.fullname" . }}-secrets
  labels:
    app: solana-ontology
type: Opaque
stringData:
  rpcApiKey: {{ .Values.secrets.rpcApiKey | quote }}
  kmsKeyId: {{ .Values.secrets.kmsKeyId | quote }}
  mpcWebhookToken: {{ .Values.secrets.mpcWebhookToken | quote }}
  omsAuthToken: {{ .Values.secrets.omsAuthToken | quote }}
